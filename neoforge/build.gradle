plugins {
    id 'net.neoforged.moddev'
}

repositories {
    maven { url = 'https://maven.neoforged.net/releases' }
}

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

base {
    archivesName = "${mod_id}-neoforge"
}

neoForge {
    version = neo_version

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(project(':common').sourceSets.main)
        }
    }

    runs {

        clientAuth {
            client()
            devLogin = true
        }

        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        data {
            data()
            programArguments.addAll '--mod', mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation project(path: ':common', configuration: 'namedElements')

    jarJar(implementation("es.pyronixstudio:Util:$utilLib")) {
        version {
            strictly "[$utilLib]"
            prefer "$utilLib"
        }
    }
    additionalRuntimeClasspath "es.pyronixstudio:Util:${project.utilLib}"

    compileOnly fileTree(dir: "${rootDir}/libs", include: ['*.jar'])
    implementation fileTree(dir: "${rootDir}/depend", include: ['*.jar'])
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            mod_id                  : mod_id,
            mod_name                : mod_name,
            mod_license             : mod_license,
            mod_version             : project.version,
            neo_version             : neo_version,
            loader_version_range    : loader_version_range,
            minecraft_version_range : minecraft_version_range,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.java.srcDirs += project(':common').sourceSets.main.java.srcDirs
sourceSets.main.resources.srcDirs += project(':common').sourceSets.main.resources.srcDirs

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.register('copiarDedicao', Exec) {
    if (org.gradle.internal.os.OperatingSystem.current().isWindows()) {
        commandLine 'cmd', '/c', 'copiarADedico.bat'
    } else {
        commandLine 'sh', 'copiarADedico.sh'
    }
}
